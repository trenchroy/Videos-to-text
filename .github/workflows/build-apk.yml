name: Build Speech to Text APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}')
          echo "Active Java version: $JAVA_VER"
          MAJOR_VER=$(echo "$JAVA_VER" | awk -F '.' '{print $1}')
          if [ "$MAJOR_VER" = "1" ]; then
            MAJOR_VER=$(echo "$JAVA_VER" | awk -F '.' '{print $2}')
          fi
          if [ -z "$MAJOR_VER" ]; then
            echo "ERROR: Java major version could not be detected."
            exit 1
          fi
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "ERROR: Active Java version ($MAJOR_VER) is lower than 17."
            exit 1
          fi
          echo "Java version $MAJOR_VER is 17 or newer. Verified."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "ERROR: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH not found. Discovered APK files in app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 4 -name "*.apk" || true
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH is empty."
            exit 1
          fi
          case "$APK_PATH" in
            *.apk) ;;
            *) echo "ERROR: $APK_PATH does not have .apk extension."; exit 1 ;;
          esac
          echo "Verified APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: speech-to-text-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="$RUNNER_TEMP/release_asset"
          mkdir -p "$ASSET_DIR"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_DIR/speech-to-text.apk"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_DIR/app-debug.apk"
          if [ ! -f "$ASSET_DIR/speech-to-text.apk" ] || [ ! -s "$ASSET_DIR/speech-to-text.apk" ]; then
            echo "ERROR: Failed to prepare speech-to-text.apk release asset."
            exit 1
          fi
          (cd "$ASSET_DIR" && zip speech-to-text.zip speech-to-text.apk)
          (cd "$ASSET_DIR" && zip app-debug.zip app-debug.apk)
          echo "speech_to_text_apk=$ASSET_DIR/speech-to-text.apk" >> $GITHUB_OUTPUT
          echo "speech_to_text_zip=$ASSET_DIR/speech-to-text.zip" >> $GITHUB_OUTPUT
          echo "app_debug_apk=$ASSET_DIR/app-debug.apk" >> $GITHUB_OUTPUT
          echo "app_debug_zip=$ASSET_DIR/app-debug.zip" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ST_APK="${{ steps.prepare_asset.outputs.speech_to_text_apk }}"
          ST_ZIP="${{ steps.prepare_asset.outputs.speech_to_text_zip }}"
          LEGACY_APK="${{ steps.prepare_asset.outputs.app_debug_apk }}"
          LEGACY_ZIP="${{ steps.prepare_asset.outputs.app_debug_zip }}"

          if [ ! -f "$ST_APK" ] || [ ! -s "$ST_APK" ]; then
            echo "ERROR: Prepared speech-to-text.apk is missing or empty."
            exit 1
          fi

          TAG="speech-to-text-v${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Speech to Text APK - Build #${{ github.run_number }}"

          echo "Deleting old releases so only the new APK remains..."
          OLD_RELEASES=$(gh release list --limit 100 --json tagName -q '.[].tagName' 2>/dev/null || true)
          for old_tag in $OLD_RELEASES; do
            if [ -n "$old_tag" ]; then
              echo "Deleting old release: $old_tag"
              gh release delete "$old_tag" --yes --cleanup-tag || true
            fi
          done

          cat << 'EOF' > release_notes.md
          ### Speech to Text APK (Latest Build)

          This is the latest automatically generated Speech to Text offline APK package built by GitHub Actions.
          - **App Name**: Speech to Text
          - **APK File**: `speech-to-text.apk`
          - **ZIP File**: `speech-to-text.zip`
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: ${{ github.sha }}

          > ⚠️ **Note**: This APK is signed with a debug keystore for easy installation and testing.
          EOF

          gh release create "$TAG" "$ST_APK" "$ST_ZIP" "$LEGACY_APK" "$LEGACY_ZIP" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes-file release_notes.md \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            TAG="speech-to-text-v${{ github.run_number }}-${{ github.run_attempt }}"
            echo "Release creation succeeded."
            gh release view "$TAG" || true
            ST_APK_URL="https://github.com/${{ github.repository }}/releases/latest/download/speech-to-text.apk"
            ST_ZIP_URL="https://github.com/${{ github.repository }}/releases/latest/download/speech-to-text.zip"
            LEGACY_APK_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
            echo "Direct Speech to Text APK URL: $ST_APK_URL"
            echo "Direct Speech to Text ZIP URL: $ST_ZIP_URL"
            {
              echo "## DIRECT SPEECH TO TEXT APK & ZIP DOWNLOAD"
              echo ""
              echo "- 📲 [Download speech-to-text.apk]($ST_APK_URL)"
              echo "- 📦 [Download speech-to-text.zip]($ST_ZIP_URL)"
              echo "- 🔗 Legacy filename: [Download app-debug.apk]($LEGACY_APK_URL)"
              echo ""
              echo "The GitHub Actions artifact \`speech-to-text-apk\` remains available as a backup."
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::GitHub Release creation failed or was skipped."
            echo "The APK build succeeded and the GitHub Actions artifact 'speech-to-text-apk' remains available as a backup."
            {
              echo "## APK Build Status"
              echo ""
              echo "GitHub Release creation was not completed. The GitHub Actions artifact \`speech-to-text-apk\` remains available for download."
            } >> $GITHUB_STEP_SUMMARY
          fi
